version: "3.4"

name: eap-system

services:
  mysql:
    container_name: eap-mysql
    image: mysql:8
    restart: unless-stopped
    tty: true
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-eap-db}
      MYSQL_USER: ${MYSQL_USER:-eap}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-eap123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root321}
    volumes:
      - ./mysql/conf/:/etc/mysql/conf.d/
      - ./mysql/data/:/var/lib/mysql/
      - ./sql/mysql/eap-db.sql:/docker-entrypoint-initdb.d/eap-db.sql:ro

  adminer:
    image: adminer
    ports:
      - 13306:8080
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      - mysql

  redis:
    container_name: eap-redis
    image: redis:6-alpine
    restart: unless-stopped
    command: redis-server --requirepass nopass
    ports:
      - "6379:6379"
    volumes:
      - ./redis:/data

  server:
    container_name: eap-server
    build:
      context: ./eap-server/
    image: eap-server
    restart: unless-stopped
    ports:
      - "48080:48080"
    environment:
      # https://github.com/polovyivan/docker-pass-configs-to-container
      SPRING_PROFILES_ACTIVE: local
      JAVA_OPTS:
        ${JAVA_OPTS:-
          -Xms512m
          -Xmx512m
          -Djava.security.egd=file:/dev/./urandom
        }
      ARGS:
        --spring.datasource.dynamic.datasource.master.url=${MASTER_DATASOURCE_URL:-jdbc:mysql://eap-mysql:3306/eap-db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true}
        --spring.datasource.dynamic.datasource.master.username=${MASTER_DATASOURCE_USERNAME:-eap}
        --spring.datasource.dynamic.datasource.master.password=${MASTER_DATASOURCE_PASSWORD:-eap123}
        --spring.datasource.dynamic.datasource.slave.url=${SLAVE_DATASOURCE_URL:-jdbc:mysql://eap-mysql:3306/eap-db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true}
        --spring.datasource.dynamic.datasource.slave.username=${SLAVE_DATASOURCE_USERNAME:-eap}
        --spring.datasource.dynamic.datasource.slave.password=${SLAVE_DATASOURCE_PASSWORD:-eap123}
        --spring.redis.host=${REDIS_HOST:-eap-redis}
        --spring.redis.password=nopass
    depends_on:
      - mysql
      - redis

  admin:
    container_name: eap-admin
    build:
      context: ./eap-ui-admin
      args:
        NODE_ENV:
          ENV=${NODE_ENV:-production}
          PUBLIC_PATH=${PUBLIC_PATH:-/}
          VUE_APP_TITLE=${VUE_APP_TITLE:-企业应用平台EAP}
          VUE_APP_BASE_API=${VUE_APP_BASE_API:-/prod-api}
          VUE_APP_APP_NAME=${VUE_APP_APP_NAME:-/}
          VUE_APP_TENANT_ENABLE=${VUE_APP_TENANT_ENABLE:-true}
          VUE_APP_CAPTCHA_ENABLE=${VUE_APP_CAPTCHA_ENABLE:-true}
          VUE_APP_DOC_ENABLE=${VUE_APP_DOC_ENABLE:-true}
          VUE_APP_BAIDU_CODE=${VUE_APP_BAIDU_CODE:-fadc1bd5db1a1d6f581df60a1807f8ab}
    image: eap-admin
    restart: unless-stopped
    ports:
      - "82:80"
    depends_on:
      - server

volumes:
  mysql:
    driver: local
  redis:
    driver: local
